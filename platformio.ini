; =====================================================================
;  ESP32-HAM-CLOCK - konfiguracja PlatformIO
;  Sprzęt: ESP32-S3-WROOM-1 N16R8 (16 MB flash QIO + 8 MB PSRAM OPI)
;          + zewnętrzny wyświetlacz ILI9488 3.5" IPS 480x320 (SPI)
;          + dotyk XPT2046 (SPI, wspólna magistrala)
;
;  Uwaga: main.cpp i tft_setup.h leżą w katalogu głównym projektu,
;  dlatego ustawiamy src_dir = .
; =====================================================================

[platformio]
src_dir = .
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Nie kompiluj szkicu testowego dotyku (tools/touch_test ma wlasny projekt).
build_src_filter = +<*> -<tools/>

; --- Port dla 'pio run -t upload' ---
; Windows (Arduino IDE / menedżer urządzeń): COM9
; Linux:   /dev/ttyACM0   |   macOS: /dev/cu.usbmodem*
; Wartość poniżej można nadpisać w linii poleceń: --upload-port COM9
upload_port = COM9
monitor_port = COM9

; --- 16 MB flash + 8 MB PSRAM (N16R8): quad flash, octal PSRAM ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode   = dio
board_upload.flash_size = 16MB
board_build.partitions   = partitions.csv
board_build.filesystem   = littlefs

monitor_speed = 115200
upload_speed  = 921600
monitor_filters = esp32_exception_decoder

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  ; Handlery WebServer dzialaja w zadaniu loop() (domyslnie 8 KB stosu).
  ; Zwiekszamy zapasowo - duze bufory JSON trzymamy na stercie, ale TLS/HTTP
  ; w kontekscie loop() lubi wiecej miejsca niz 8 KB.
  -DARDUINO_LOOP_STACK_SIZE=16384
  ; TFT_eSPI.h robi __has_include(<tft_setup.h>) i tylko wtedy uznaje nasz setup.
  ; Dodajemy katalog projektu do sciezki include biblioteki (bez tego TFT_eSPI
  ; cicho bierze domyslny User_Setup.h = ILI9341 + piny ESP8266 -> crash).
  -I${PROJECT_DIR}

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  bblanchon/ArduinoJson @ ^6.21.5
  knolleary/PubSubClient @ ^2.8
  https://github.com/Hopperpop/Sgp4-Library.git
  ; Dekodery obrazu do ekranu startowego (PNG/JPG) - patrz drawImageFromFS().
  https://github.com/Bodmer/TJpg_Decoder.git
  https://github.com/kikuchan/pngle.git

; --- Wariant bez dotyku (gdy XPT2046 odłączony) ---
; Wyłącza dotyk: wiszące MISO dawałoby fałszywe dotknięcia.
[env:esp32-s3-n16r8-notouch]
extends = env:esp32-s3-n16r8
build_flags =
  ${env:esp32-s3-n16r8.build_flags}
  -DTOUCH_ENABLED=0

; --- Wariant z INNYMI pinami TFT/dotyku (przyklad zmiany pinow) ---
; Nie edytuj tft_setup.h - nadpisz piny tutaj. Wartosci ponizej sa PRZYKLADEM
; (przeniesienie TFT_CS/DC i T_DO na inne wolne GPIO). Zmien na swoje.
[env:esp32-s3-n16r8-altpins]
extends = env:esp32-s3-n16r8
build_flags =
  ${env:esp32-s3-n16r8.build_flags}
  -DTFT_MISO=13
  -DTFT_CS=10
  -DTFT_DC=9
  -DTOUCH_CS=15
  -DTOUCH_IRQ=16
  -DTFT_BL=21
