; Test sprzetowy dotyku XPT2046 dla ESP32-S3 N16R8.
; Wgrywa sam szkic (bez WiFi/UI) i wypisuje surowe wspolrzedne na Serial.
;   pio run -e touch_test -t upload      (port COM9 z platformio.ini)
;   pio device monitor -e touch_test
[env:touch_test]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM9
monitor_port = COM9

; N16R8: quad flash + octal PSRAM (jak w glownym projekcie)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode   = dio
board_upload.flash_size  = 16MB
; Ta sama tablica partycji co firmware (app0 @0x10000, 4 MB)
board_build.partitions   = ../../partitions.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DTOUCH_ENABLED=1
  -DTOUCH_CS=15
  -DTOUCH_IRQ=16
  -I${PROJECT_DIR}/tools/touch_test

lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
